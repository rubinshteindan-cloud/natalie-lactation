<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>עריכת תוכן | נטלי בארטפלד</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <section class="admin-card admin-login" data-login>
        <img src="./nb-hero.png" alt="" />
        <h1>עריכת תוכן</h1>
        <p>הכניסי סיסמה כדי לפתוח את כלי העריכה.</p>
        <form data-login-form>
          <label for="admin-password">סיסמה</label>
          <input id="admin-password" type="password" autocomplete="current-password" />
          <button type="submit">כניסה</button>
        </form>
      </section>

      <section class="admin-card admin-editor" data-editor hidden>
        <div class="admin-editor-head">
          <div>
            <h1>עריכת טקסטים באתר</h1>
            <p>אחרי שמירה, Cloudflare יעדכן את האתר בדרך כלל תוך דקה או שתיים.</p>
          </div>
          <a href="./index.html" aria-label="חזרה לאתר">חזרה לאתר</a>
        </div>

        <div class="admin-token">
          <label for="github-token">GitHub token</label>
          <input id="github-token" type="password" autocomplete="off" placeholder="Token עם הרשאת Contents: Read and write" />
        </div>

        <form class="admin-form" data-content-form>
          <fieldset>
            <legend>פתיח ראשי</legend>
            <label>
              שורת כותרת 1
              <input name="hero.title.0" />
            </label>
            <label>
              שורת כותרת 2
              <input name="hero.title.1" />
            </label>
            <label>
              שורת כותרת 3
              <input name="hero.title.2" />
            </label>
            <label>
              טקסט פתיחה
              <textarea name="hero.intro" rows="7"></textarea>
            </label>
          </fieldset>

          <fieldset>
            <legend>מקטע היכרות</legend>
            <label>
              כותרת
              <input name="intro.title" />
            </label>
            <label>
              טקסט
              <textarea name="intro.body" rows="4"></textarea>
            </label>
          </fieldset>

          <fieldset>
            <legend>איך אפשר לעזור</legend>
            <label>
              כותרת
              <input name="support.title" />
            </label>
            <label>
              שורת הסבר
              <input name="support.subtitle" />
            </label>
            <div class="admin-grid" data-support-cards></div>
          </fieldset>

          <fieldset>
            <legend>עובדות מתחלפות</legend>
            <label>
              כל שורה היא עובדה אחת
              <textarea name="facts" rows="12"></textarea>
            </label>
          </fieldset>

          <div class="admin-actions">
            <button type="button" data-refresh>טען מחדש</button>
            <button type="submit">שמור ופרסם</button>
          </div>
          <p class="admin-status" data-status role="status"></p>
        </form>
      </section>
    </main>

    <script>
      const PASSWORD = "18110509";
      const REPO_OWNER = "rubinshteindan-cloud";
      const REPO_NAME = "natalie-lactation";
      const BRANCH = "main";
      const CONTENT_PATH = "content.json";

      const loginPanel = document.querySelector("[data-login]");
      const editorPanel = document.querySelector("[data-editor]");
      const loginForm = document.querySelector("[data-login-form]");
      const contentForm = document.querySelector("[data-content-form]");
      const statusLine = document.querySelector("[data-status]");
      const tokenInput = document.getElementById("github-token");
      const supportCards = document.querySelector("[data-support-cards]");
      const refreshButton = document.querySelector("[data-refresh]");

      let currentContent = null;

      const setStatus = (message, type = "") => {
        statusLine.textContent = message;
        statusLine.dataset.type = type;
      };

      const getPath = (source, path) => {
        return path.split(".").reduce((value, key) => value?.[key], source);
      };

      const setPath = (target, path, value) => {
        const parts = path.split(".");
        const last = parts.pop();
        let cursor = target;
        parts.forEach((part, index) => {
          const nextPart = parts[index + 1] ?? last;
          if (cursor[part] === undefined) {
            cursor[part] = Number.isInteger(Number(nextPart)) ? [] : {};
          }
          cursor = cursor[part];
        });
        cursor[last] = value;
      };

      const toBase64 = (value) => {
        const bytes = new TextEncoder().encode(value);
        let binary = "";
        bytes.forEach((byte) => {
          binary += String.fromCharCode(byte);
        });
        return btoa(binary);
      };

      const apiHeaders = () => {
        const token = tokenInput.value.trim();
        if (!token) {
          throw new Error("צריך להכניס GitHub token לפני שמירה.");
        }
        return {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${token}`,
          "X-GitHub-Api-Version": "2022-11-28"
        };
      };

      const createSupportCardFields = (cards) => {
        supportCards.innerHTML = "";
        cards.forEach((card, index) => {
          const group = document.createElement("div");
          group.className = "admin-card-fields";
          group.innerHTML = `
            <strong>כרטיס ${index + 1}</strong>
            <label>
              כותרת
              <input name="support.cards.${index}.title" />
            </label>
            <label>
              טקסט
              <textarea name="support.cards.${index}.body" rows="3"></textarea>
            </label>
          `;
          supportCards.append(group);
        });
      };

      const fillForm = (content) => {
        currentContent = content;
        createSupportCardFields(content.support.cards);
        contentForm.querySelectorAll("[name]").forEach((field) => {
          if (field.name === "facts") {
            field.value = content.facts.join("\n");
            return;
          }
          const value = getPath(content, field.name);
          field.value = typeof value === "string" ? value : "";
        });
      };

      const readForm = () => {
        const nextContent = JSON.parse(JSON.stringify(currentContent));
        contentForm.querySelectorAll("[name]").forEach((field) => {
          if (field.name === "facts") {
            nextContent.facts = field.value
              .split("\n")
              .map((line) => line.trim())
              .filter(Boolean);
            return;
          }
          setPath(nextContent, field.name, field.value.trim());
        });
        return nextContent;
      };

      const loadContent = async () => {
        setStatus("טוען תוכן...");
        const response = await fetch(`./${CONTENT_PATH}?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error("לא הצלחתי לטעון את קובץ התוכן.");
        }
        const content = await response.json();
        fillForm(content);
        setStatus("התוכן נטען. אפשר לערוך.");
      };

      const publishContent = async (content) => {
        setStatus("שומר ל-GitHub...");
        const fileUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CONTENT_PATH}?ref=${BRANCH}`;
        const fileResponse = await fetch(fileUrl, { headers: apiHeaders() });
        if (!fileResponse.ok) {
          throw new Error("לא הצלחתי לקרוא את הקובץ מ-GitHub. בדוק שה-token נכון.");
        }
        const file = await fileResponse.json();
        const nextJson = `${JSON.stringify(content, null, 2)}\n`;
        const saveResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CONTENT_PATH}`, {
          method: "PUT",
          headers: {
            ...apiHeaders(),
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Update editable site content",
            content: toBase64(nextJson),
            sha: file.sha,
            branch: BRANCH
          })
        });
        if (!saveResponse.ok) {
          throw new Error("השמירה נכשלה. בדוק הרשאות token או נסה שוב.");
        }
        currentContent = content;
        setStatus("נשמר ופורסם. האתר יתעדכן בעוד דקה או שתיים.", "success");
      };

      const unlock = async () => {
        loginPanel.hidden = true;
        editorPanel.hidden = false;
        await loadContent();
      };

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("admin-password").value;
        if (password !== PASSWORD) return;
        window.sessionStorage.setItem("adminAccess", "1");
        try {
          await unlock();
        } catch (error) {
          setStatus(error.message, "error");
        }
      });

      contentForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          await publishContent(readForm());
        } catch (error) {
          setStatus(error.message, "error");
        }
      });

      refreshButton.addEventListener("click", async () => {
        try {
          await loadContent();
        } catch (error) {
          setStatus(error.message, "error");
        }
      });

      if (window.sessionStorage.getItem("adminAccess") === "1") {
        unlock().catch((error) => setStatus(error.message, "error"));
      }
    </script>
  </body>
</html>
